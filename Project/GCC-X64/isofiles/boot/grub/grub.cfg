set timeout=10
set default=0

function rme_boot {
    if [ "$grub_platform" = "efi" ]; then
        insmod efi_gop
    fi

    if multiboot2 /boot/RME; then
        if [ "$grub_platform" = "pc" ]; then
            set gfxpayload=text
        else
            if [ -n "$1" ]; then
                set gfxpayload="$1"
            fi
            echo "GRUB: RME loaded, handing off to the kernel..."
            sleep 2
        fi
        boot
    fi
}

menuentry "RME Microkernel" {
    rme_boot
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "RME Microkernel (UEFI 1024x768)" {
        rme_boot 1024x768x32,800x600x32,auto
    }
fi
